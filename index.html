<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台股 AI 投資雷達</title>
  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
      color: #1f2937;
    }

    .card {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 40px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    .status {
      display: inline-block;
      background: #dcfce7;
      color: #166534;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      margin: 20px 0;
    }

    .next {
      margin-top: 30px;
      color: #64748b;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>📈 台股 AI 投資雷達</h1>

    <p>我的台股投資決策輔助系統</p>

    <div class="status">
      ● 系統測試成功
    </div>

    <p>
      長期投資 TOP 5 ・ 短線機會 TOP 5 ・ 除息機會
    </p>

    <p class="next">
      V1 建置中
    </p>

  </div>

</body>
</html>
